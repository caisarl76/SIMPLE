# native/psi0_eval_runtime/Cargo.toml
[package]
name = "psi0-eval-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
hex = "0.4.3"
libc = "0.2.158"
nix = { version = "0.27.1", default-features = false, features = ["fs", "mount", "process", "sched", "signal", "socket", "user"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
thiserror = "1.0.63"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
